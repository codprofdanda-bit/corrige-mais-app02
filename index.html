<!DOCTYPE html>

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Corrige+ — Correção de Provas 8º ano</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#1c2740;--mute:#667089;--rule:#d5dae6;--pen:#d6283a;--ok:#1c7a58;--ok-bg:#e3f4ec;--bad-bg:#fbe6e8;--ac:#1c2740;--ac-t:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121826;--card:#1a2236;--ink:#e8ecf6;--mute:#9aa4bd;--rule:#2d3856;--pen:#ff6b7a;--ok:#5fd3a2;--ok-bg:#16382d;--bad-bg:#3d1c24;--ac:#e8ecf6;--ac-t:#121826}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:820px;margin:0 auto;padding:20px 16px 64px}
h1{font:700 26px/1.2 Georgia,"Times New Roman",serif;margin:8px 0 4px}

.brand{display:flex;align-items:baseline;margin:8px 0 4px;font-family:Georgia,"Times New Roman",serif;line-height:1;letter-spacing:-0.5px}
.brand-name{font:800 38px/1 Georgia,"Times New Roman",serif;background:linear-gradient(120deg,#6d28d9 0%,#a855f7 45%,#ec4899 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;filter:drop-shadow(0 2px 4px rgba(109,40,217,.18))}
.brand-plus{font:900 48px/1 Georgia,"Times New Roman",serif;color:#ff2d55;text-shadow:0 4px 16px rgba(255,45,85,.55),0 0 28px rgba(255,45,85,.3);margin-left:2px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .brand-name{background:linear-gradient(120deg,#c4b5fd 0%,#e879f9 45%,#f9a8d4 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}:root:not([data-theme="light"]) .brand-plus{color:#ff6b8a;text-shadow:0 4px 16px rgba(255,107,138,.6),0 0 28px rgba(255,107,138,.35)}}

.sub{color:var(--mute);margin:0 0 18px}
nav{display:flex;gap:4px;border-bottom:2px solid var(--rule);margin-bottom:20px;overflow-x:auto}
nav button{background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-2px;padding:10px 14px;font:inherit;color:var(--mute);cursor:pointer;white-space:nowrap}
nav button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--pen);font-weight:600}
.card{background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:16px;margin-bottom:14px}
label{display:block;font-size:14px;color:var(--mute);margin:10px 0 4px}
input[type=text],textarea,select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--rule);border-radius:6px;padding:9px 10px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}
button.b{font:inherit;padding:9px 14px;border-radius:6px;border:1px solid var(--rule);background:var(--card);color:var(--ink);cursor:pointer}
button.p{background:var(--ac);color:var(--ac-t);border-color:var(--ac)}
button.g{background:var(--ok);color:#fff;border-color:var(--ok)}
button.d{color:var(--pen)}
button.w{background:#25d366;color:#fff;border-color:#25d366}
a.b{display:inline-flex;align-items:center;gap:6px;text-decoration:none;font:inherit;padding:9px 14px;border-radius:6px;border:1px solid var(--rule);background:var(--card);color:var(--ink);cursor:pointer}
a.b.p{background:var(--ac);color:var(--ac-t);border-color:var(--ac)}
.qh{display:flex;justify-content:space-between;align-items:center;gap:8px;font-family:Georgia,serif;font-weight:700}
.pick{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.pick button{min-width:46px;height:44px;border-radius:8px;border:1px solid var(--rule);background:var(--bg);color:var(--ink);font:600 16px inherit;cursor:pointer}
.pick button[aria-pressed="true"]{background:var(--ac);color:var(--ac-t);border-color:var(--ac)}
.grade{text-align:center;padding:10px 0 4px}
.grade svg{width:180px;height:120px;overflow:visible}
.grade text{font:700 44px Georgia,serif;fill:var(--pen)}
.grade p{margin:6px 0 0;color:var(--mute)}
.mark{display:inline-block;padding:2px 8px;border-radius:5px;font-size:14px;font-weight:600;margin:2px}
.mark.ok{background:var(--ok-bg);color:var(--ok)}
.mark.no{background:var(--bad-bg);color:var(--pen)}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:9px 6px;border-bottom:1px solid var(--rule)}
th{color:var(--mute);font-weight:500;font-size:14px}
.wrap{overflow-x:auto}
.empty{color:var(--mute);text-align:center;padding:24px 0}
.camov{position:fixed;inset:0;z-index:99;background:#000;display:flex;flex-direction:column}
.camov video{width:100%;height:100%;object-fit:cover;background:#000;display:block}
.camst{padding:12px 16px;color:#fff;background:#111;font-size:14px;text-align:center;white-space:pre-line}
.camrow{justify-content:center;background:#111;padding:0 16px 12px;margin:0}
.camrow button{color:#fff;background:#333;border-color:#555}
.camrow button.p{background:var(--ok);border-color:var(--ok)}

/* ===== Guia de enquadramento na câmera ===== */
.camwrap{flex:1;min-height:0;position:relative;overflow:hidden}
.camguide{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:2}
.camguide-frame{
  position:relative;
  width:min(80vw, 340px, calc(72vh * 94 / 137));
  aspect-ratio:94 / 137;
  border:2px dashed rgba(255,255,255,.85);
  border-radius:12px;
  box-shadow:0 0 0 100vmax rgba(0,0,0,.42);
  transition:border-color .2s, border-style .2s, border-width .2s;
}
.camguide .corner{
  position:absolute;
  width:30px;height:30px;
  border:3px solid #22c55e;
  border-radius:0;
  transition:border-color .2s;
}
.camguide .corner.tl{top:-3px;left:-3px;border-right:0;border-bottom:0;border-top-left-radius:10px}
.camguide .corner.tr{top:-3px;right:-3px;border-left:0;border-bottom:0;border-top-right-radius:10px}
.camguide .corner.br{bottom:-3px;right:-3px;border-left:0;border-top:0;border-bottom-right-radius:10px}
.camguide .corner.bl{bottom:-3px;left:-3px;border-right:0;border-top:0;border-bottom-left-radius:10px}
.camguide .qr-hint{
  position:absolute;
  top:6px;right:6px;
  width:22%;aspect-ratio:1;
  border:1.5px dashed rgba(255,255,255,.75);
  border-radius:5px;
  font:700 11px system-ui;
  color:#fff;
  display:flex;align-items:center;justify-content:center;
  background:rgba(0,0,0,.2);
}
.camguide .guide-tip{
  position:absolute;
  left:50%;bottom:-42px;
  transform:translateX(-50%);
  background:rgba(0,0,0,.72);
  color:#fff;
  padding:6px 12px;
  border-radius:20px;
  font:600 12px system-ui;
  white-space:nowrap;
  max-width:90%;
  overflow:hidden;
  text-overflow:ellipsis;
  text-align:center;
  transition:background .2s;
}
.camguide.detected .camguide-frame{border-color:#fbbf24}
.camguide.detected .corner{border-color:#fbbf24}
.camguide.detected .guide-tip{background:rgba(180,83,9,.92)}
.camguide.ready .camguide-frame{border-style:solid;border-color:#22c55e;border-width:3px}
.camguide.ready .guide-tip{background:rgba(22,101,52,.92)}

/* ===== Guia antes de tirar foto ===== */
.photoguide{
  position:fixed;inset:0;z-index:200;
  background:rgba(15,23,42,.85);
  display:flex;align-items:center;justify-content:center;
  padding:16px;
  backdrop-filter:blur(4px);
}
.photoguide-box{
  background:#1a2236;
  border-radius:14px;
  padding:20px;
  max-width:380px;width:100%;
  color:#e8ecf6;
  box-shadow:0 20px 60px rgba(0,0,0,.5);
  border:1px solid #2d3856;
}
.photoguide-title{font:700 18px Georgia,serif;margin:0 0 14px;color:#fff;text-align:center}
.photoguide-svg{
  background:#2d3856;
  border-radius:8px;
  padding:16px;
  margin:0 auto 14px;
  max-width:180px;
}
.photoguide-svg svg{width:100%;height:auto;display:block}
.photoguide-list{
  list-style:none;padding:0;margin:0 0 16px;
  text-align:left;font-size:14px;line-height:1.6;color:#cbd5e1;
}
.photoguide-list li{padding-left:20px;position:relative;margin:5px 0}
.photoguide-list li::before{content:"✓";position:absolute;left:0;color:#22c55e;font-weight:700}
.photoguide .b{background:#2d3856;color:#e8ecf6;border-color:#3b4a6b}
.photoguide .b:hover{background:#3b4a6b;border-color:#5b6d92}
.photoguide .b.p{background:#22c55e;color:#fff;border-color:#22c55e}
.photoguide .b.p:hover{background:#16a34a;border-color:#16a34a}

/* ===== Feedback visual das questões respondidas ===== */
.pick button.ok{background:var(--ok) !important;color:#fff !important;border-color:var(--ok) !important;border-width:2px !important}
.pick button.wrong{background:var(--bad-bg) !important;color:var(--pen) !important;border-color:var(--pen) !important;border-width:2px !important}
.pick button.revealed{background:#fef3c7 !important;color:#92400e !important;border-color:#d97706 !important;border-width:2px !important}
.pick button.revealed::after{content:" ✓";font-weight:700}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .pick button.revealed{background:#3d2e10 !important;color:#fbbf24 !important;border-color:#d97706 !important}
}
.legend{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--mute);margin:0 0 12px 2px}
.legend span.chip{display:inline-flex;align-items:center;gap:6px}
.legend span.chip i{width:14px;height:14px;border-radius:3px;display:inline-block;font-style:normal}
.legend span.chip i.ok-bg{background:var(--ok)}
.legend span.chip i.wrong-bg{background:var(--bad-bg);border:1.5px solid var(--pen)}
.legend span.chip i.revealed-bg{background:#fef3c7;border:1.5px solid #d97706}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .legend span.chip i.revealed-bg{background:#3d2e10;border-color:#d97706}
}

/* ===== Tutorial ===== */
.tut h2{font:700 20px/1.3 Georgia,"Times New Roman",serif;margin:0 0 6px;color:var(--ink)}
.tut h3{font:700 16px/1.3 Georgia,"Times New Roman",serif;margin:22px 0 8px;color:var(--ink);padding-bottom:6px;border-bottom:1px solid var(--rule)}
.tut h4{font:700 14px/1.3 system-ui,sans-serif;margin:16px 0 4px;color:var(--ink)}
.tut p{margin:8px 0;color:var(--ink)}
.tut ul{margin:8px 0 12px;padding-left:22px}
.tut li{margin:6px 0;line-height:1.55}
.tut .dica{background:var(--ok-bg);border-left:4px solid var(--ok);padding:10px 12px;border-radius:6px;margin:14px 0;font-size:14px;color:var(--ink)}
.tut .atencao{background:var(--bad-bg);border-left:4px solid var(--pen);padding:10px 12px;border-radius:6px;margin:14px 0;font-size:14px;color:var(--ink)}
.tut .parte{display:inline-block;background:var(--ac);color:var(--ac-t);font:700 12px system-ui,sans-serif;padding:3px 10px;border-radius:20px;margin-bottom:10px;letter-spacing:.5px}
.tut .num{display:inline-block;background:var(--ok);color:#fff;font:700 13px system-ui,sans-serif;width:24px;height:24px;line-height:24px;text-align:center;border-radius:50%;margin-right:6px;vertical-align:middle}
.tut .kbd{display:inline-block;background:var(--bg);border:1px solid var(--rule);border-radius:4px;padding:1px 6px;font:600 13px monospace;color:var(--ink)}
.tut strong{color:var(--ink);font-weight:700}

@media print{.camov,.camguide,.camwrap,.photoguide{display:none!important} nav,.noprint,h1,.sub,.brand,a.b{display:none!important}}
</style>

<script>
var LET=["A","B","C","D"];
var tab="tutorial", S={turma:{name:"",students:[]}, header:{school:"",teacher:"",date:""}}, notas=[];

function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}

var SH={W:190,H:270,FID:[[5,5],[185,5],[185,265],[5,265]],QR:{x:134,y:12,s:50},ROWS:25,COLS:4,Y0:70,PY:7.2,CW:45,BP:8,BR:2.4};
function cardPos(i,n){
 var C=Math.min(SH.COLS,Math.ceil(n/SH.ROWS)),R=Math.ceil(n/C),col=Math.floor(i/R),row=i%R;
 var x0=10+(SH.COLS-C)*SH.CW/2+col*SH.CW;
 return {x0:x0,cy:SH.Y0+row*SH.PY,bx:function(j){return x0+12+j*SH.BP}}
}
function omrKey(id,n){var h=2166136261,i;for(i=0;i<id.length;i++){h^=id.charCodeAt(i);h=Math.imul(h,16777619)}var s=h>>>0,k=[];for(i=0;i<n;i++){s=(Math.imul(s,1664525)+1013904223)>>>0;k.push(s>>>24)}return k}
function omrUnpack(t,n,id){var s;try{s=atob(t.replace(/-/g,"+").replace(/_/g,"/"))}catch(e){return null}var nb=Math.ceil(n/4);if(s.length!==nb)return null;var k=omrKey(id,nb),a=[];for(var i=0;i<n;i++){var b=s.charCodeAt(i>>2)^k[i>>2];a.push((b>>((i&3)*2))&3)}return a}

function omrGray(img){var n=img.width*img.height,g=new Uint8Array(n),d=img.data;for(var i=0,k=0;i<n;i++,k+=4)g[i]=(d[k]*77+d[k+1]*150+d[k+2]*29)>>8;return g}
function omrBlobs(g,w,h,kt){
 var s=Math.max(15,Math.round(w/9))|1,r=s>>1,W1=w+1,I=new Uint32Array(W1*(h+1)),x,y;
 for(y=0;y<h;y++){var rs=0;for(x=0;x<w;x++){rs+=g[y*w+x];I[(y+1)*W1+x+1]=I[y*W1+x+1]+rs}}
 var B=new Uint8Array(w*h);
 for(y=0;y<h;y++){var y0=Math.max(0,y-r),y1=Math.min(h,y+r+1);
  for(x=0;x<w;x++){var x0=Math.max(0,x-r),x1=Math.min(w,x+r+1);
   var sum=I[y1*W1+x1]-I[y0*W1+x1]-I[y1*W1+x0]+I[y0*W1+x0];
   if(g[y*w+x]<sum/((x1-x0)*(y1-y0))*(kt||0.72))B[y*w+x]=1}}
 var st=new Int32Array(w*h),out=[],minA=Math.max(30,w*w*0.00008);
 for(var p0=0;p0<w*h;p0++){
  if(B[p0]!==1)continue;
  var sp=0,a=0,sx=0,sy=0,bx0=w,bx1=0,by0=h,by1=0;st[sp++]=p0;B[p0]=2;
  while(sp){var p=st[--sp],px=p%w,py=(p-px)/w;a++;sx+=px;sy+=py;
   if(px<bx0)bx0=px;if(px>bx1)bx1=px;if(py<by0)by0=py;if(py>by1)by1=py;
   if(px>0&&B[p-1]===1){B[p-1]=2;st[sp++]=p-1}
   if(px<w-1&&B[p+1]===1){B[p+1]=2;st[sp++]=p+1}
   if(py>0&&B[p-w]===1){B[p-w]=2;st[sp++]=p-w}
   if(py<h-1&&B[p+w]===1){B[p+w]=2;st[sp++]=p+w}}
  if(a>=minA)out.push({a:a,x0:bx0,x1:bx1,y0:by0,y1:by1,cx:sx/a,cy:sy/a})
 }
 return out
}
function omrIn(P,x,y){
 var sg=0;
 for(var i=0;i<4;i++){var a=P[i],b=P[(i+1)%4],c=(b.x-a.x)*(y-a.y)-(b.y-a.y)*(x-a.x);
  if(c&&sg&&(c>0)!==(sg>0))return false;if(c)sg=c}

}
function omrHalf(g,w,h){
 var w2=w>>1,h2=h>>1,o=new Uint8Array(w2*h2);
 for(var y=0;y<h2;y++)for(var x=0;x<w2;x++){var p=2*y*w+2*x;o[y*w2+x]=(g[p]+g[p+1]+g[p+w]+g[p+w+1])>>2}
 return o
}
function omrFid(bl,w,box){
 var c=bl.filter(function(b){
  var bw=b.x1-b.x0+1,bh=b.y1-b.y0+1,asp=bw/bh,fill=b.a/(bw*bh);
  if(bw<w*0.012||bh<w*0.012||bw>w*0.25||bh>w*0.25||asp<0.4||asp>2.5||fill<0.42)return false;
  if(box&&omrIn(box,b.cx,b.cy))return false;
  return true});
 c.sort(function(a,b){return b.a-a.a});c=c.slice(0,10);
 var best=null,bs=0,n=c.length,a,b,d,e;
 for(a=0;a<n;a++)for(b=a+1;b<n;b++)for(d=b+1;d<n;d++)for(e=d+1;e<n;e++){
  var P=[c[a],c[b],c[d],c[e]],mx=Math.max(P[0].a,P[1].a,P[2].a,P[3].a),mn=Math.min(P[0].a,P[1].a,P[2].a,P[3].a);
  if(mx/mn>2.6)continue;
  var mxx=0,myy=0;P.forEach(function(p){mxx+=p.cx/4;myy+=p.cy/4});
  P.sort(function(u,v){return Math.atan2(u.cy-myy,u.cx-mxx)-Math.atan2(v.cy-myy,v.cx-mxx)});
  var sg=0,ok=true,ar=0,i;
  for(i=0;i<4;i++){var p=P[i],q=P[(i+1)%4],t=P[(i+2)%4];
   var cr=(q.cx-p.cx)*(t.cy-q.cy)-(q.cy-p.cy)*(t.cx-q.cx);
   if(!cr||(sg&&(cr>0)!==(sg>0))){ok=false;break}sg=cr;
   ar+=p.cx*q.cy-q.cx*p.cy}
  if(!ok)continue;ar=Math.abs(ar)/2;
  var L=[];for(i=0;i<4;i++)L.push(Math.hypot(P[i].cx-P[(i+1)%4].cx,P[i].cy-P[(i+1)%4].cy));
  var rt=(L[0]+L[2])/(L[1]+L[3]);
  if(!((rt>0.45&&rt<0.95)||(rt>1.05&&rt<2.2)))continue;
  if(ar>bs){bs=ar;best=P.map(function(p){return {x:p.cx,y:p.cy}})}}
 return best
}
function omrH(src,dst){
 var A=[],b=[],i,c,r,k;
 for(i=0;i<4;i++){var x=src[i][0],y=src[i][1],u=dst[i].x,v=dst[i].y;
  A.push([x,y,1,0,0,0,-u*x,-u*y]);b.push(u);A.push([0,0,0,x,y,1,-v*x,-v*y]);b.push(v)}
 for(c=0;c<8;c++){var pv=c;for(r=c+1;r<8;r++)if(Math.abs(A[r][c])>Math.abs(A[pv][c]))pv=r;
  var t=A[c];A[c]=A[pv];A[pv]=t;t=b[c];b[c]=b[pv];b[pv]=t;
  if(Math.abs(A[c][c])<1e-12)return null;
  for(r=0;r<8;r++)if(r!==c){var f=A[r][c]/A[c][c];if(f){for(k=c;k<8;k++)A[r][k]-=f*A[c][k];b[r]-=f*b[c]}}}
 var h=[];for(i=0;i<8;i++)h.push(b[i]/A[i][i]);return h
}
function omrMap(h,x,y){var d=h[6]*x+h[7]*y+1;return [(h[0]*x+h[1]*y+h[2])/d,(h[3]*x+h[4]*y+h[5])/d]}

function omrRead(img){
 var w=img.width,h=img.height;
 var q=jsQR(img.data,w,h,{inversionAttempts:"dontInvert"});
 if(!q)return {st:"noqr"};
 var m=/^CP2\|([0-9a-z]+)\|(\d+)-(\d+)\|(\d+)\|([A-Za-z0-9_-]+)\|([0-9a-z,]*)(?:\|(.+))?$/.exec(q.data);

 c.appendChild(r);
 if(!window.isSecureContext)c.appendChild(el("p","sub","Dica: em endereço sem https, a câmera ao vivo é bloqueada — use 'Tirar foto do cartão'."));
 v.appendChild(c);

 if(!scanSess){
  v.appendChild(el("p","empty","Nenhum cartão lido ainda."));
  return
 }
 var nc=el("div","card");
 nc.appendChild(el("label",null,"Nome do aluno"));
 var ni=el("input");ni.type="text";ni.value=alunoAtual||student;ni.oninput=function(){student=ni.value;alunoAtual=ni.value};
 nc.appendChild(ni);
 if(scanSess.nv>1)nc.appendChild(el("p","sub","Versão da prova identificada pelo QR: Prova "+scanSess.v+" de "+scanSess.nv));
 v.appendChild(nc);

 if(scanMsg){
  var bc=el("div","card in");
  bc.appendChild(el("p","sub",scanMsg));
  v.appendChild(bc);
 }

 /* Legenda das cores do feedback */
 var legend = el("div","legend");
 legend.innerHTML =
   '<span class="chip"><i class="ok-bg"></i> Acertou</span>'+
   '<span class="chip"><i class="wrong-bg"></i> Marcou errado</span>'+
   '<span class="chip"><i class="revealed-bg"></i> Gabarito correto</span>';
 v.appendChild(legend);

 var Q=scanSess.Q, tot=Q.reduce(function(s,q){return s+(+q.p||0)},0);
 Q.forEach(function(q,i){
  var k=el("div","card");
  k.appendChild(el("div","qh","Questão "+(i+1)+" — vale "+fmt(q.p||0)));
  var p=el("div","pick");
  var gotItRight = (ans[i]===q.a);
  q.o.forEach(function(o,j){
    var b=el("button",null,LET[j]);
    b.type="button";
    b.setAttribute("aria-pressed",ans[i]===j);
    var isSelected = (ans[i]===j);
    var isCorrect = (q.a===j);
    if (isSelected && gotItRight) {
      b.classList.add("ok");
    } else if (isSelected && !gotItRight) {
      b.classList.add("wrong");
    } else if (!isSelected && isCorrect && !gotItRight) {
      b.classList.add("revealed");
    }
    b.onclick=function(){ans[i]=ans[i]===j?undefined:j;last=calcNota(Q,tot);render()};
    p.appendChild(b)
  });
  k.appendChild(p);v.appendChild(k)});

 var act=el("div","row");
 act.appendChild(btn("Recalcular nota","p",function(){
  last=calcNota(Q,tot);render();
  setTimeout(function(){var g=document.getElementById("gr");if(g)g.scrollIntoView({behavior:"smooth",block:"center"})},100)}));
 act.appendChild(btn("Limpar respostas","",function(){ans={};last=calcNota(Q,tot);render()}));
 act.appendChild(btn("Novo cartão","",function(){scanSess=null;scanMsg=null;ans={};last=null;alunoAtual="";student="";render()}));
 v.appendChild(act);

 if(last){
  var g=el("div","card grade");g.id="gr";
  g.innerHTML='<svg viewBox="0 0 180 120" aria-hidden="true"><ellipse cx="90" cy="60" rx="82" ry="46" fill="none" stroke="var(--pen)" stroke-width="3" stroke-linecap="round" stroke-dasharray="480 20" transform="rotate(-4 90 60)"/><text x="90" y="76" text-anchor="middle"></text></svg><p></p>';
  g.querySelector("text").textContent=fmt(last.sc)+"/"+fmt(last.max);
  g.querySelector("p").textContent="Acertos: "+last.det.filter(Boolean).length+" de "+last.det.length;
  var mrow=el("div");mrow.style.cssText="text-align:center;margin-top:8px";
  last.det.forEach(function(ok,i){mrow.appendChild(el("span","mark "+(ok?"ok":"no"),(i+1)+(ok?" ✓":" ✘ era "+LET[Q[i].a])))});
  g.appendChild(mrow);
  var sv=el("div","row");sv.style.justifyContent="center";
  sv.appendChild(btn("💾 Salvar nota na turma","g",function(){
   last=calcNota(Q,tot);
   var nome=(alunoAtual||student||"").trim();
   if(!nome){
    nome=prompt("Digite o nome do aluno para salvar a nota:");
    if(!nome||!nome.trim()){alert("O nome é obrigatório para salvar.");return}
    nome=nome.trim();alunoAtual=nome;student=nome
   }
   salvarNota(nome,last.sc,last.max,last.det.filter(Boolean).length,last.det.length,scanSess.v);
   scanSess=null;scanMsg=null;ans={};last=null;alunoAtual="";student="";tab="notas";render()
  }));
  sv.appendChild(btn("📱 Enviar esta nota via WhatsApp","w",function(){
   var nome=alunoAtual||student||"Aluno";
   var nota10=last.max>0?last.sc/last.max*10:0;
   var txt="*"+nome+"*\nProva: "+nomeProva()+"\nNota: *"+fmt(nota10)+"/10*\nAcertos: "+last.det.filter(Boolean).length+"/"+last.det.length+" ("+fmt(last.sc)+"/"+fmt(last.max)+")";
   shareWhatsApp(txt)
  }));
  g.appendChild(sv);
  v.appendChild(g)
 }
}

function nomeProva(){return "Avaliação de Matemática — 8º ano"}
function shareWhatsApp(txt){
 if(navigator.share){
  navigator.share({text:txt}).catch(function(){});
 }else{
  window.open("https://wa.me/?text="+encodeURIComponent(txt),"_blank");
 }
}
function salvarNota(nome,sc,max,acertos,total,v){
 var nota10=max>0?sc/max*10:0;
 if(!nome||!nome.trim()){
  var ts=new Date().toLocaleString("pt-BR").replace(/[^\d]/g,"").slice(-6);
  nome="Aluno sem nome (cartão "+ts+")";
 }
 var idx=notas.findIndex(function(n){return n.name===nome});
 var reg={name:nome,sc:sc,max:max,nota10:nota10,acertos:acertos,total:total,v:v,data:new Date().toLocaleDateString("pt-BR")};
 if(idx>=0)notas[idx]=reg;else notas.push(reg);
 saveNotas()
}
function vNotas(v){
 var c=el("div","card");
 c.appendChild(el("div","qh","Notas da turma"+(S.turma.name?" — "+S.turma.name:"")));
 if(!notas.length){
  c.appendChild(el("p","empty","Nenhuma nota salva ainda. Leia um cartão na aba anterior."));
  v.appendChild(c);return
 }
 var ordem=S.turma.students.slice();
 var lista=notas.slice();
 if(ordem.length){
  lista.sort(function(a,b){
   var ia=ordem.indexOf(a.name),ib=ordem.indexOf(b.name);
   if(ia<0&&ib<0)return a.name.localeCompare(b.name);
   if(ia<0)return 1;if(ib<0)return -1;return ia-ib
  })
 }else lista.sort(function(a,b){return a.name.localeCompare(b.name)});

 var w=el("div","wrap"),t=el("table");
 var th=el("tr");["#","Aluno","Nota (0–10)","Acertos","Data",""].forEach(function(x){th.appendChild(el("th",null,x))});t.appendChild(th);
 var soma=0;
 lista.forEach(function(r,i){
  soma+=r.nota10||0;
  var tr=el("tr");
  tr.appendChild(el("td",null,String(i+1)));
  tr.appendChild(el("td",null,r.name));
  var tdNota=el("td");tdNota.innerHTML="<b>"+fmt(r.nota10||0)+"</b>";
  tdNota.style.color=r.nota10>=6?"var(--ok)":"var(--pen)";
  tr.appendChild(tdNota);
  tr.appendChild(el("td",null,(r.acertos||0)+"/"+(r.total||0)));
  tr.appendChild(el("td",null,r.data||""));
  var tdA=el("td");
  tdA.appendChild(btn("WhatsApp","w",function(){
   var txt="*"+r.name+"*\nProva: "+nomeProva()+"\nNota: *"+fmt(r.nota10)+"/10*\nAcertos: "+r.acertos+"/"+r.total;
   shareWhatsApp(txt)
  }));
  tr.appendChild(tdA);
  t.appendChild(tr)
 });
 w.appendChild(t);c.appendChild(w);
 var media=soma/lista.length;
 var mb=el("div");mb.style.cssText="margin-top:12px;font-size:15px";
 mb.innerHTML="<b>Média da turma:</b> "+fmt(media)+" &nbsp;•&nbsp; Alunos lançados: "+lista.length;
 c.appendChild(mb);

 var r2=el("div","row");
 r2.appendChild(btn("📱 Enviar lista da turma via WhatsApp","w",function(){
  var linhas=[];
  linhas.push("*Notas — "+nomeProva()+"*");
  if(S.turma.name)linhas.push(S.turma.name);
  linhas.push("");
  lista.forEach(function(r,i){
   linhas.push((i+1)+". "+r.name+" — *"+fmt(r.nota10)+"/10* ("+r.acertos+"/"+r.total+")")
  });
  linhas.push("");
  linhas.push("_Média da turma: "+fmt(media)+"_");
  shareWhatsApp(linhas.join("\n"))
 }));
 r2.appendChild(btn("Limpar todas as notas","d",function(){
  if(confirm("Apagar todas as notas?")){notas=[];saveNotas();render()}
 }));
 c.appendChild(r2);
 v.appendChild(c);

 if(S.turma.students.length){
  var falta=S.turma.students.filter(function(nome){return !notas.some(function(n){return n.name===nome})});
  if(falta.length){
   var fc=el("div","card");
   fc.appendChild(el("div","qh","Alunos sem nota ("+falta.length+")"));
   falta.forEach(function(n){fc.appendChild(el("div",null,"• "+n))});
   v.appendChild(fc)
  }
 }
}

function tabs(){
 var n=document.getElementById("tabs");n.textContent="";
 [["tutorial","Tutorial"],["ler","Ler cartão"],["notas","Notas ("+notas.length+")"]].forEach(function(t){
  var b=el("button",null,t[1]);b.type="button";b.setAttribute("role","tab");b.setAttribute("aria-selected",tab===t[0]);
  b.onclick=function(){tab=t[0];render()};n.appendChild(b)})
}

function render(){
 tabs();
 var v=document.getElementById("view");v.textContent="";
 ({tutorial:vTutorial,ler:vLer,notas:vNotas})[tab](v);
}
load();render();
</script>
</body>
</html>
